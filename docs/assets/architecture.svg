<svg viewBox="0 0 842 653" width="842" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/>
    </marker>
  </defs>
  <!-- White canvas: keeps every label readable when GitHub shows the page in dark mode. -->
  <rect x="0" y="0" width="842" height="653" fill="#ffffff"/>
  <text x="421" y="34" font-size="16" fill="#1e293b" text-anchor="middle">How brick serves a page, an action and a push</text>
  <!-- Layer groups: x=22..552, each 112 tall, 30 apart. -->
  <rect x="22" y="56" width="530" height="112" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="32" y="70" font-size="11" fill="#64748b">Browser</text>
  <rect x="22" y="198" width="530" height="112" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="32" y="212" font-size="11" fill="#64748b">HTTP</text>
  <rect x="22" y="340" width="530" height="112" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="32" y="354" font-size="11" fill="#64748b">Engine</text>
  <rect x="22" y="482" width="530" height="112" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="32" y="496" font-size="11" fill="#64748b">Storage</text>
  <rect x="580" y="56" width="240" height="403" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="590" y="70" font-size="11" fill="#64748b">Plugins — contrib/*, one module each</text>
  <rect x="580" y="484" width="240" height="112" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="590" y="498" font-size="11" fill="#64748b">Operations</text>
  <!-- Down: blue requests, numbered. Up: green answers. -->
  <path d="M100,158 L 100,212" fill="none" stroke="#3b82f6" marker-end="url(#arrow-blue)"/>
  <path d="M124,218 L 124,164" fill="none" stroke="#22c55e" marker-end="url(#arrow-green)"/>
  <text x="90" y="186" font-size="10" fill="#1e40af" text-anchor="end">① GET /page</text>
  <text x="134" y="186" font-size="10" fill="#166534">HTML</text>
  <path d="M275,158 L 275,212" fill="none" stroke="#3b82f6" marker-end="url(#arrow-blue)"/>
  <path d="M299,218 L 299,164" fill="none" stroke="#22c55e" marker-end="url(#arrow-green)"/>
  <text x="265" y="186" font-size="10" fill="#1e40af" text-anchor="end">④ POST</text>
  <text x="309" y="186" font-size="10" fill="#166534">envelope</text>
  <path d="M450,158 L 450,212" fill="none" stroke="#3b82f6" marker-end="url(#arrow-blue)"/>
  <path d="M474,218 L 474,164" fill="none" stroke="#22c55e" marker-end="url(#arrow-green)"/>
  <text x="440" y="186" font-size="10" fill="#1e40af" text-anchor="end">⑦ connect</text>
  <text x="484" y="186" font-size="10" fill="#166534">push</text>
  <path d="M100,300 L 100,354" fill="none" stroke="#3b82f6" marker-end="url(#arrow-blue)"/>
  <path d="M124,360 L 124,306" fill="none" stroke="#22c55e" marker-end="url(#arrow-green)"/>
  <text x="90" y="328" font-size="10" fill="#1e40af" text-anchor="end">② render</text>
  <text x="134" y="328" font-size="10" fill="#166534">HTML</text>
  <path d="M275,300 L 275,354" fill="none" stroke="#3b82f6" marker-end="url(#arrow-blue)"/>
  <path d="M299,360 L 299,306" fill="none" stroke="#22c55e" marker-end="url(#arrow-green)"/>
  <text x="265" y="328" font-size="10" fill="#1e40af" text-anchor="end">⑤ run action</text>
  <text x="309" y="328" font-size="10" fill="#166534">result</text>
  <path d="M450,300 L 450,354" fill="none" stroke="#3b82f6" marker-end="url(#arrow-blue)"/>
  <path d="M474,360 L 474,306" fill="none" stroke="#22c55e" marker-end="url(#arrow-green)"/>
  <text x="440" y="328" font-size="10" fill="#1e40af" text-anchor="end">⑧ subscribe</text>
  <text x="484" y="328" font-size="10" fill="#166534">events</text>
  <path d="M100,442 L 100,496" fill="none" stroke="#3b82f6" marker-end="url(#arrow-blue)"/>
  <path d="M124,502 L 124,448" fill="none" stroke="#22c55e" marker-end="url(#arrow-green)"/>
  <text x="90" y="470" font-size="10" fill="#1e40af" text-anchor="end">③ read</text>
  <text x="134" y="470" font-size="10" fill="#166534">files</text>
  <path d="M275,442 L 275,496" fill="none" stroke="#3b82f6" marker-end="url(#arrow-blue)"/>
  <path d="M299,502 L 299,448" fill="none" stroke="#22c55e" marker-end="url(#arrow-green)"/>
  <text x="265" y="470" font-size="10" fill="#1e40af" text-anchor="end">⑥ load · save</text>
  <text x="309" y="470" font-size="10" fill="#166534">state</text>
  <path d="M450,442 L 450,496" fill="none" stroke="#3b82f6" marker-end="url(#arrow-blue)"/>
  <path d="M474,502 L 474,448" fill="none" stroke="#22c55e" marker-end="url(#arrow-green)"/>
  <text x="440" y="470" font-size="10" fill="#1e40af" text-anchor="end">⑨ publish</text>
  <text x="484" y="470" font-size="10" fill="#166534">messages</text>
  <!-- Boxes. -->
  <rect x="37" y="81" width="150" height="72" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="112" y="105" font-size="12" fill="#1e40af" text-anchor="middle">HTML page</text>
  <text x="112" y="122" font-size="10" fill="#1e40af" text-anchor="middle">plain links and forms</text>
  <text x="112" y="137" font-size="10" fill="#1e40af" text-anchor="middle">work with JS off</text>
  <rect x="212" y="81" width="150" height="72" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="287" y="105" font-size="12" fill="#1e40af" text-anchor="middle">runtime.js</text>
  <text x="287" y="122" font-size="10" fill="#1e40af" text-anchor="middle">mount · navigate</text>
  <text x="287" y="137" font-size="10" fill="#1e40af" text-anchor="middle">bindings · transitions</text>
  <rect x="387" y="81" width="150" height="72" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="462" y="105" font-size="12" fill="#1e40af" text-anchor="middle">EventSource</text>
  <text x="462" y="122" font-size="10" fill="#1e40af" text-anchor="middle">server push (SSE)</text>
  <text x="462" y="137" font-size="10" fill="#1e40af" text-anchor="middle">one per page, all topics</text>
  <rect x="37" y="223" width="150" height="72" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="112" y="247" font-size="12" fill="#b45309" text-anchor="middle">site.Handler</text>
  <text x="112" y="264" font-size="10" fill="#b45309" text-anchor="middle">routes · render cache</text>
  <text x="112" y="279" font-size="10" fill="#b45309" text-anchor="middle">islands · markdown</text>
  <rect x="212" y="223" width="150" height="72" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="287" y="247" font-size="12" fill="#b45309" text-anchor="middle">ActionHandler</text>
  <text x="287" y="264" font-size="10" fill="#b45309" text-anchor="middle">POST /_brick/action</text>
  <text x="287" y="279" font-size="10" fill="#b45309" text-anchor="middle">sealed state handle</text>
  <rect x="387" y="223" width="150" height="72" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="462" y="247" font-size="12" fill="#b45309" text-anchor="middle">EventsHandler</text>
  <text x="462" y="264" font-size="10" fill="#b45309" text-anchor="middle">GET /_brick/events</text>
  <text x="462" y="279" font-size="10" fill="#b45309" text-anchor="middle">server-sent events</text>
  <rect x="37" y="365" width="150" height="72" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="112" y="389" font-size="12" fill="#6b21a8" text-anchor="middle">Render pipeline</text>
  <text x="112" y="406" font-size="10" fill="#6b21a8" text-anchor="middle">scan → transpile →</text>
  <text x="112" y="421" font-size="10" fill="#6b21a8" text-anchor="middle">one html/template</text>
  <rect x="212" y="365" width="150" height="72" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="287" y="389" font-size="12" fill="#6b21a8" text-anchor="middle">Action runtime</text>
  <text x="287" y="406" font-size="10" fill="#6b21a8" text-anchor="middle">load state · call</text>
  <text x="287" y="421" font-size="10" fill="#6b21a8" text-anchor="middle">re-render · envelope</text>
  <rect x="387" y="365" width="150" height="72" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="462" y="389" font-size="12" fill="#6b21a8" text-anchor="middle">Push hub</text>
  <text x="462" y="406" font-size="10" fill="#6b21a8" text-anchor="middle">jobs report back</text>
  <text x="462" y="421" font-size="10" fill="#6b21a8" text-anchor="middle">presence · topics</text>
  <rect x="37" y="507" width="150" height="72" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="112" y="531" font-size="12" fill="#166534" text-anchor="middle">Options.FS</text>
  <text x="112" y="548" font-size="10" fill="#166534" text-anchor="middle">pages · components</text>
  <text x="112" y="563" font-size="10" fill="#166534" text-anchor="middle">.star scripts · data</text>
  <rect x="212" y="507" width="150" height="72" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="287" y="531" font-size="12" fill="#166534" text-anchor="middle">StateStore</text>
  <text x="287" y="548" font-size="10" fill="#166534" text-anchor="middle">memory · sealed</text>
  <text x="287" y="563" font-size="10" fill="#166534" text-anchor="middle">Redis · SQL (bytes)</text>
  <rect x="387" y="507" width="150" height="72" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="462" y="531" font-size="12" fill="#166534" text-anchor="middle">Broadcaster</text>
  <text x="462" y="548" font-size="10" fill="#166534" text-anchor="middle">in-process memory</text>
  <text x="462" y="563" font-size="10" fill="#166534" text-anchor="middle">Redis pub/sub</text>
  <rect x="595" y="81" width="210" height="72" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="700" y="105" font-size="12" fill="#1e293b" text-anchor="middle">Scripts and content</text>
  <text x="700" y="122" font-size="10" fill="#1e293b" text-anchor="middle">script-starlark · markdown-goldmark</text>
  <text x="700" y="137" font-size="10" fill="#1e293b" text-anchor="middle">sanitize-bluemonday · image-webp</text>
  <rect x="595" y="178" width="210" height="72" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="700" y="202" font-size="12" fill="#1e293b" text-anchor="middle">Shared state and push</text>
  <text x="700" y="219" font-size="10" fill="#1e293b" text-anchor="middle">states-redis · states-sql</text>
  <text x="700" y="234" font-size="10" fill="#1e293b" text-anchor="middle">push-redis · ratelimit-redis</text>
  <rect x="595" y="275" width="210" height="72" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="700" y="299" font-size="12" fill="#1e293b" text-anchor="middle">Keys and uploads</text>
  <text x="700" y="316" font-size="10" fill="#1e293b" text-anchor="middle">keys-awskms · keys-gcpkms</text>
  <text x="700" y="331" font-size="10" fill="#1e293b" text-anchor="middle">keys-vault · upload-s3</text>
  <rect x="595" y="372" width="210" height="72" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="700" y="396" font-size="12" fill="#1e293b" text-anchor="middle">Serving and tracing</text>
  <text x="700" y="413" font-size="10" fill="#1e293b" text-anchor="middle">assets-http</text>
  <text x="700" y="428" font-size="10" fill="#1e293b" text-anchor="middle">actions-otel (OpenTelemetry)</text>
  <rect x="595" y="509" width="210" height="72" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="700" y="533" font-size="12" fill="#1e293b" text-anchor="middle">brick CLI · dev server</text>
  <text x="700" y="550" font-size="10" fill="#1e293b" text-anchor="middle">serve · build · check · fmt · lsp</text>
  <text x="700" y="565" font-size="10" fill="#1e293b" text-anchor="middle">bricktest · statetest · task check</text>
  <!-- Legend. -->
  <path d="M153,622 L 176,622" fill="none" stroke="#3b82f6" marker-end="url(#arrow-blue)"/>
  <text x="198" y="626" font-size="10" fill="#64748b">request, numbered in reading order</text>
  <path d="M403,622 L 426,622" fill="none" stroke="#22c55e" marker-end="url(#arrow-green)"/>
  <text x="448" y="626" font-size="10" fill="#64748b">answer: HTML, action envelope, pushed update</text>
</svg>
