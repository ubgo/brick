---
state:
  value: 1
brick:
  model: value
---
<brick:script>
def dec(state, props):
    return dict(state, value = max(0, state["value"] - 1))

def inc(state, props):
    return dict(state, value = state["value"] + 1)
</brick:script>
<span class="stepper">
  <button id="dec" brick:click="dec">−</button>
  <b id="value">{{ .State.value }}</b>
  <button id="inc" brick:click="inc">+</button>
</span>
