<!doctype html>
<html lang="{{ .Page.Locale }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ .Title }} · {{ .Site.title }}</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style type="text/tailwindcss">
  @custom-variant dark (&:where(.dark, .dark *));
  body { @apply bg-slate-50 text-slate-800 text-[13px] leading-relaxed antialiased dark:bg-slate-950 dark:text-slate-200; }
  header#top { @apply sticky top-0 z-10 border-b border-slate-200 bg-white/90 backdrop-blur dark:border-slate-800 dark:bg-slate-900/90; }
  header#top .bar { @apply mx-auto flex h-11 max-w-4xl items-center gap-4 px-4; }
  header#top .brand { @apply font-semibold tracking-tight text-slate-900 dark:text-white; }
  header#top nav { @apply flex flex-1 flex-wrap items-center gap-1; }
  header#top nav a { @apply rounded px-2 py-1 text-slate-600 no-underline hover:bg-slate-100 hover:text-slate-900 dark:text-slate-300 dark:hover:bg-slate-800; }
  .account { @apply text-xs text-slate-500; }
  .account a { @apply rounded border border-slate-300 px-2 py-0.5 text-slate-700 no-underline hover:bg-slate-100 dark:border-slate-700 dark:text-slate-200; }
  main { @apply mx-auto max-w-4xl space-y-4 px-4 py-6; }
  main h1 { @apply text-xl font-semibold tracking-tight text-slate-900 dark:text-white; }
  main h2 { @apply mt-2 text-sm font-semibold uppercase tracking-wide text-slate-500; }
  main a { @apply text-indigo-600 no-underline hover:underline dark:text-indigo-400; }
  section.demo, .card, .counter, .likes, form.signup, .clock, .recent, .bio, .bk-tabs, .tabs, details.bk-accordion, .bk-carousel { @apply rounded-lg border border-slate-200 bg-white p-4 shadow-sm dark:border-slate-800 dark:bg-slate-900; }
  section.demo > h2:first-child { @apply mt-0 mb-2; }
  .card h3 { @apply mb-1 text-sm font-semibold text-slate-900 dark:text-white; }
  .card--featured { @apply border-indigo-300 ring-1 ring-indigo-200 dark:border-indigo-700 dark:ring-indigo-900; }
  ul.posts { @apply list-none space-y-1 p-0; }
  ul.recent { @apply list-none space-y-1 px-4 py-2; }
  ul.posts li, ul.recent li { @apply border-b border-slate-100 py-1 last:border-0 dark:border-slate-800; }
  pre { @apply overflow-x-auto rounded-md bg-slate-900 p-3 font-mono text-xs text-slate-100; }
  button, .opener { @apply inline-flex h-7 cursor-pointer items-center gap-1 rounded-md border border-slate-300 bg-white px-3 text-xs font-medium text-slate-700 hover:bg-slate-50 disabled:opacity-50 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-200; }
  button.primary { @apply border-indigo-600 bg-indigo-600 text-white hover:bg-indigo-500; }
  input:not([type=checkbox]) { @apply h-7 rounded-md border border-slate-300 bg-white px-2 text-xs dark:border-slate-700 dark:bg-slate-800; }
  form.signup { @apply space-y-2; }
  .error { @apply text-xs text-rose-600; }
  .done { @apply font-medium text-emerald-600; }
  .fallback { @apply rounded-md border border-amber-200 bg-amber-50 p-2 text-xs text-amber-800 dark:border-amber-900 dark:bg-amber-950 dark:text-amber-200; }
  .tabs [role=tablist] { @apply mb-2 flex gap-1; }
  .clock time { @apply font-mono text-lg tabular-nums; }
  dialog { @apply rounded-lg border border-slate-300 p-4 shadow-xl; }
  img.team { @apply rounded-md; }
  aside#player { @apply fixed right-4 bottom-4 rounded-full border border-slate-200 bg-white px-3 py-1 text-xs text-slate-500 shadow dark:border-slate-700 dark:bg-slate-900; }
  [aria-busy=true] { @apply opacity-60; }
</style>
<script>if (matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.classList.add("dark")</script>
</head>
<body>
{{ provide "accent" "blue" }}
<header id="top">
  <div class="bar">
    <a class="brand" href="/">brick</a>
    <nav>
      <a href="/" brick:prefetch>Home</a>
      <a href="/blog/" brick:prefetch>Blog</a>
      <a href="/about/" brick:prefetch>About</a>
      <a href="/fr/about/">Français</a>
      <a href="/features/islands/" brick:prefetch>Islands</a>
      <a href="/features/live/" brick:prefetch>Live</a>
      <a href="/features/data/" brick:prefetch>Data</a>
      <a href="/features/kit/" brick:prefetch>Kit</a>
      <a href="/features/images/" brick:prefetch>Images</a>
      <a href="/features/client/" brick:prefetch>Client</a>
      <a href="/download.zip" brick:nav="off">Download</a>
    </nav>
    <Account />
  </div>
</header>
<main>{{ children }}</main>
<aside id="player" brick:persist>▶ this element survives navigation</aside>
{{ assets }}
</body>
</html>
