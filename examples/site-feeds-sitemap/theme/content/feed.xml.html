---
title: Feed
---
<?xml version="1.0" encoding="utf-8"?>
<rss version="2.0">
<channel>
<title>{{ .Site.title }}</title>
<link>{{ .Site.baseURL }}/</link>
{{- range .Site.Pages }}{{ if eq .Section "blog" }}
<item><title>{{ .Title }}</title><link>{{ $.Site.baseURL }}{{ .URL }}</link><description>{{ .Description }}</description></item>
{{- end }}{{ end }}
</channel>
</rss>
