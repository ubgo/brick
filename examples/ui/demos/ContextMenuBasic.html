<ContextMenu label="Canvas actions" style="width: 100%">
  <brick:prop name="target"><div style="display: grid; place-items: center; height: 10rem; border: 1.5px dashed var(--bk-border); border-radius: var(--bk-radius-lg); color: var(--bk-muted-fg); font-size: var(--bk-text-sm)">Right-click here, long-press on a phone, or focus and press Shift+F10</div></brick:prop>
  <MenuLabel>Canvas</MenuLabel>
  <MenuItem icon="plus" shortcut="⌘N">New frame</MenuItem>
  <MenuItem icon="copy" shortcut="⌘V">Paste here</MenuItem>
  <MenuItem icon="image">Add image…</MenuItem>
  <MenuSeparator />
  <MenuItem icon="grid" shortcut="⌘'">Show grid</MenuItem>
  <MenuItem icon="lock" disabled>Lock canvas</MenuItem>
</ContextMenu>
