---
props:
  label: {type: string, default: "Revenue"}
---
<brick:script>
def slow_total():
    # A stand-in for a slow query: the page does not wait for it.
    pause(900)
    return "$48,210"
</brick:script>
<div id="rz-panel" style="border: 1px solid var(--bk-border); border-radius: var(--bk-radius); padding: 1rem">
  <div style="color: var(--bk-muted-fg); font-size: var(--bk-text-sm)">{{ .Props.label }} (loaded after the page)</div>
  <div id="rz-total" style="font-size: var(--bk-text-2xl); font-weight: 600">{{ slow_total }}</div>
</div>
