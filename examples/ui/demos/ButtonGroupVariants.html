<ButtonGroup label="View">
  <Button variant="outline" icon="list" :aria-pressed="`true`">List</Button>
  <Button variant="outline" icon="grid" :aria-pressed="`false`">Grid</Button>
  <Button variant="outline" icon="kanban" :aria-pressed="`false`">Board</Button>
</ButtonGroup>
<ButtonGroup label="Publish">
  <Button icon="send">Publish</Button>
  <Button square icon="chevron-down" label="More publish options" />
</ButtonGroup>
<ButtonGroup label="Pages">
  <Button variant="secondary" square icon="chevron-left" label="Previous page" />
  <Button variant="secondary">1</Button>
  <Button variant="secondary" aria-current="page">2</Button>
  <Button variant="secondary">3</Button>
  <Button variant="secondary" square icon="chevron-right" label="Next page" />
</ButtonGroup>
