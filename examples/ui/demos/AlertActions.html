<div style="display: grid; gap: .75rem; width: 100%">
  <Alert variant="warning" title="Unsaved changes">
    You edited 3 fields on this page. Leave now and they are lost.
    <brick:prop name="actions">
      <Button size="sm">Save changes</Button>
      <Button size="sm" variant="ghost">Discard</Button>
    </brick:prop>
  </Alert>
  <Alert variant="success" dismissible>Profile updated. Close me — the button appears once JavaScript runs.</Alert>
  <Alert variant="info" icon="zap" dismissible>Tip: press <kbd>⌘K</kbd> to search every page.</Alert>
  <Alert variant="neutral" noIcon>A plain note with no title and no icon.</Alert>
</div>
