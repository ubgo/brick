<Grid :md="3" gap="sm" style="width: 100%">
  <Card title="Default" description="The page's accent.">
    <Stack direction="row" gap="xs"><Button size="sm">Save</Button><Button size="sm" variant="soft">Draft</Button></Stack>
  </Card>
  <Card title="Rose" description="Tokens set on this card." style="--bk-primary: var(--bk-swatch-rose); --bk-primary-hover: color-mix(in oklab, var(--bk-swatch-rose), black 12%)">
    <Stack direction="row" gap="xs"><Button size="sm">Save</Button><Button size="sm" variant="soft">Draft</Button></Stack>
  </Card>
  <Card title="Square" description="Radii overridden too." style="--bk-primary: var(--bk-swatch-emerald); --bk-radius: 0; --bk-radius-lg: 0; --bk-primary-hover: color-mix(in oklab, var(--bk-swatch-emerald), black 12%)">
    <Stack direction="row" gap="xs"><Button size="sm">Save</Button><Button size="sm" variant="soft">Draft</Button></Stack>
  </Card>
</Grid>
