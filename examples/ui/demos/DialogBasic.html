<Dialog title="Invite teammates" description="They get an e-mail with a link to join this workspace.">
  <brick:prop name="trigger"><Button icon="users">Invite teammates</Button></brick:prop>
  <p style="color: var(--bk-muted-fg)">Everyone you invite joins as a <b style="color: var(--bk-fg)">member</b>. Change their role later under Settings → Members.</p>
  <brick:prop name="footer">
    <Button variant="ghost" data-bk-close>Cancel</Button>
    <Button icon="send" data-bk-close>Send invites</Button>
  </brick:prop>
</Dialog>
