---
use:
  people: ~/data/demo-people.yaml
---
<Carousel label="Team" :perView="3" gap="sm" style="width: 100%">
  {{ range .Data.people }}<div style="display: grid; justify-items: center; gap: .4rem; padding: 1.25rem; border: 1px solid var(--bk-border); border-radius: var(--bk-radius-lg); background: var(--bk-surface); text-align: center"><Avatar :name=".name" size="xl" :status=".presence" /><b>{{ .name }}</b><span style="font-size: var(--bk-text-xs); color: var(--bk-muted-fg)">{{ .role }}</span></div>{{ end }}
</Carousel>
