<ButtonGroup label="Text style">
  <Button variant="outline" square icon="bold" label="Bold" />
  <Button variant="outline" square icon="italic" label="Italic" />
  <Button variant="outline" square icon="underline" label="Underline" />
</ButtonGroup>
<ButtonGroup label="Alignment">
  <Button variant="outline" square icon="align-left" label="Align left" :aria-pressed="`true`" />
  <Button variant="outline" square icon="align-center" label="Align centre" :aria-pressed="`false`" />
  <Button variant="outline" square icon="align-right" label="Align right" :aria-pressed="`false`" />
</ButtonGroup>
<ButtonGroup label="History">
  <Button variant="outline" size="sm" icon="arrow-left">Undo</Button>
  <Button variant="outline" size="sm" iconRight="arrow-right">Redo</Button>
</ButtonGroup>
