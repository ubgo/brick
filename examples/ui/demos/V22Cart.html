---
state:
  qty: 2
---
{{/*
The parent binds its qty to the stepper's model. The total reads qty, so
it follows the stepper; "Reset" writes qty here, and the stepper shows
it on the next render.
*/}}
<div style="display: grid; gap: .6rem">
  <div style="display: flex; align-items: center; gap: .75rem">
    <span>Quantity</span>
    <V22Stepper brick:model="qty" />
    <Button id="v22-reset" size="sm" variant="ghost" brick:click='$set("qty", 1)'>Reset to 1</Button>
  </div>
  <span id="v22-total">Total: ${{ mul .State.qty 12 }} ({{ .State.qty }} × $12)</span>
</div>
