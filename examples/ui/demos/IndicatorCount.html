<Stack direction="row" gap="xl" wrap>
  <Indicator :count="3" label="3 unread notifications"><Button variant="outline" square icon="bell" label="Notifications" /></Indicator>
  <Indicator :count="12" tone="primary" label="12 messages"><Button variant="outline" square icon="mail" label="Messages" /></Indicator>
  <Indicator :count="250" label="More than 99 items in cart"><Button variant="outline" square icon="shopping-cart" label="Cart" /></Indicator>
  <Indicator :count="0" label="No new notifications"><Button variant="outline" square icon="inbox" label="Inbox" /></Indicator>
</Stack>
