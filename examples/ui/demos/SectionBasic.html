      <Stack direction="row" justify="between" style="padding: .75rem 1rem"><Text size="sm">Comments on your posts</Text><Text as="span" size="sm" tone="muted">Email, push</Text></Stack>

      <Stack direction="row" justify="between" style="padding: .75rem 1rem"><Text size="sm">Weekly summary</Text><Text as="span" size="sm" tone="muted">Email</Text></Stack>
    </Stack>
  </Card>
</Section>
